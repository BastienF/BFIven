---

# Runs on localhost with the credentials of the AWS_* environment variables (an account able to manage EC2 and IAM).
# Creates the exit instance and its first EIP once; afterwards it only reads them: coursator rotates the EIP itself,
# with the IAM user created below.

- name: read aws account
  amazon.aws.aws_caller_info:
  register: coursator_sortie_aws_caller

- name: find default vpc
  amazon.aws.ec2_vpc_net_info:
    region: "{{ coursator_sortie_aws_region }}"
    filters:
      is-default: "true"
  register: coursator_sortie_aws_vpcs

- name: find default subnets
  amazon.aws.ec2_vpc_subnet_info:
    region: "{{ coursator_sortie_aws_region }}"
    filters:
      vpc-id: "{{ coursator_sortie_aws_vpcs.vpcs[0].id }}"
      default-for-az: "true"
  register: coursator_sortie_aws_subnets

- name: import ssh key
  amazon.aws.ec2_key:
    region: "{{ coursator_sortie_aws_region }}"
    name: "{{ coursator_sortie_aws_name }}"
    key_material: "{{ coursator_sortie_aws_ssh_public_key }}"
    # Imported once: comparing it would import then delete a temporary key pair
    force: false
    tags:
      projet: "{{ coursator_sortie_aws_tag }}"

# Inbound: SSH from the hypervisor only. The tunnel is opened by the instance: its replies need no inbound rule.
- name: create security group
  amazon.aws.ec2_security_group:
    region: "{{ coursator_sortie_aws_region }}"
    name: "{{ coursator_sortie_aws_name }}"
    description: "coursator exit - SSH from the bfiven hypervisor only"
    vpc_id: "{{ coursator_sortie_aws_vpcs.vpcs[0].id }}"
    rules:
      - proto: tcp
        ports: [22]
        cidr_ip: "{{ coursator_sortie_aws_ssh_allowed_ip }}/32"
        rule_desc: "SSH from the bfiven hypervisor"
    rules_egress:
      - proto: all
        cidr_ip: "0.0.0.0/0"
    tags:
      projet: "{{ coursator_sortie_aws_tag }}"
  register: coursator_sortie_aws_security_group

- name: find exit instance
  amazon.aws.ec2_instance_info:
    region: "{{ coursator_sortie_aws_region }}"
    filters:
      "tag:projet": "{{ coursator_sortie_aws_tag }}"
      instance-state-name: ["pending", "running", "stopping", "stopped"]
  register: coursator_sortie_aws_instances

- name: check that a single instance carries the tag
  assert:
    that:
      - coursator_sortie_aws_instances.instances | length <= 1
    fail_msg: "Several instances are tagged projet={{ coursator_sortie_aws_tag }}: terminate the extra ones by hand."

- name: create exit instance and its first eip
  when: coursator_sortie_aws_instances.instances | length == 0
  block:
    - name: find latest debian 12 arm64 image
      amazon.aws.ec2_ami_info:
        region: "{{ coursator_sortie_aws_region }}"
        owners: ["{{ coursator_sortie_aws_ami_owner }}"]
        filters:
          name: "{{ coursator_sortie_aws_ami_name }}"
          architecture: "arm64"
          state: "available"
      register: coursator_sortie_aws_amis

    - name: create exit instance
      amazon.aws.ec2_instance:
        region: "{{ coursator_sortie_aws_region }}"
        name: "{{ coursator_sortie_aws_name }}"
        instance_type: "{{ coursator_sortie_aws_instance_type }}"
        image_id: "{{ (coursator_sortie_aws_amis.images | sort(attribute='creation_date') | last).image_id }}"
        key_name: "{{ coursator_sortie_aws_name }}"
        vpc_subnet_id: "{{ coursator_sortie_aws_subnets.subnets[0].id }}"
        security_group: "{{ coursator_sortie_aws_security_group.group_id }}"
        network:
          assign_public_ip: true
        volumes:
          - device_name: "/dev/xvda"
            ebs:
              volume_size: "{{ coursator_sortie_aws_volume_size }}"
              volume_type: "gp3"
              delete_on_termination: true
        metadata_options:
          http_tokens: "required"
        tags:
          projet: "{{ coursator_sortie_aws_tag }}"
        wait: true
        state: running
      register: coursator_sortie_aws_created

    # AssociateAddress also authorizes the network interface: coursator's policy requires the tag on it
    - name: tag exit instance network interface
      amazon.aws.ec2_tag:
        region: "{{ coursator_sortie_aws_region }}"
        resource: "{{ coursator_sortie_aws_created.instances[0].network_interfaces[0].network_interface_id }}"
        tags:
          projet: "{{ coursator_sortie_aws_tag }}"

    - name: allocate and associate the first eip
      amazon.aws.ec2_eip:
        region: "{{ coursator_sortie_aws_region }}"
        device_id: "{{ coursator_sortie_aws_created.instances[0].instance_id }}"
        in_vpc: true
        release_on_disassociation: false
        tags:
          projet: "{{ coursator_sortie_aws_tag }}"
          Name: "{{ coursator_sortie_aws_name }}"

- name: read exit instance
  amazon.aws.ec2_instance_info:
    region: "{{ coursator_sortie_aws_region }}"
    filters:
      "tag:projet": "{{ coursator_sortie_aws_tag }}"
      instance-state-name: ["running"]
  register: coursator_sortie_aws_running
  until: coursator_sortie_aws_running.instances | map(attribute='public_ip_address', default='') | select | list | length == 1
  retries: 12
  delay: 10

# Its current public address, whichever EIP coursator associated: the gateway play reaches it through the hypervisor
- name: add exit instance to the inventory
  add_host:
    name: "{{ coursator_sortie_aws_name }}"
    groups: coursator_sortie_gateway
    ansible_host: "{{ coursator_sortie_aws_running.instances[0].public_ip_address }}"
    ansible_user: "{{ coursator_sortie_aws_ssh_user }}"
    # The alias keeps one known host key across EIP rotations
    ansible_ssh_common_args: >-
      -o ProxyJump={{ coursator_sortie_aws_ssh_jump_host }}
      -o HostKeyAlias={{ coursator_sortie_aws_name }} -o StrictHostKeyChecking=accept-new
  changed_when: false

- import_tasks: iam.yml
