---

- meta: flush_handlers

- name: Create networks
  become: true
  docker_network:
    name: "{{ item.name }}"
  with_items: "{{ gatus_docker_networks }}"

- name: Start or restart gatus container
  become: true
  docker_container:
    name: "{{ gatus_container_name }}"
    image: "{{ gatus_image }}:v{{ gatus_version }}"
    state: "{{ gatus_docker_state | default('started') }}"
    restart: "{{ gatus_docker_restart | default(false) | bool }}"
    networks: "{{ gatus_docker_networks }}"
    restart_policy: "{{ gatus_container_restart_policy }}"
    env:
      GATUS_CONFIG_PATH: "/config/config.yaml"
    volumes:
      - "{{ gatus_conf_location }}/config.yaml:/config/config.yaml:ro"
      - "{{ gatus_data_location }}:/data"
    labels: "{{ gatus_traefik_labels | items2dict }}"
