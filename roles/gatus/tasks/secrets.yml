---

# Push key of an external endpoint: <group>_<name>, with " /_,.#+&" replaced by "-" in each part
- set_fact:
    gatus_external_endpoint_keys: >-
      {{ gatus_external_endpoints
         | map(attribute='group') | map('regex_replace', '[ /_,.#+&]', '-')
         | zip(gatus_external_endpoints | map(attribute='name') | map('regex_replace', '[ /_,.#+&]', '-'))
         | map('join', '_') | list }}

- name: create a secrets file
  become: true
  copy:
    force: false
    content: "{}"
    dest: "{{ gatus_secrets_file_location }}"
    mode: "0600"
  when: inventory_hostname == gatus_secrets_host

- name: slurp secret file
  become: true
  slurp:
    src: "{{ gatus_secrets_file_location }}"
  register: gatus_slurped_secrets
  when: inventory_hostname == gatus_secrets_host
  no_log: true

- set_fact:
    gatus_secrets: "{{ gatus_slurped_secrets['content'] | b64decode | from_json }}"
  when: inventory_hostname == gatus_secrets_host
  no_log: true

# The ntfy topic is public on ntfy.sh: its random name is what keeps it private
- name: enrich ntfy topic
  set_fact:
    gatus_secrets: "{{ gatus_secrets | combine({'NtfyTopic': 'bfiven-alerts-' ~ lookup('password', '/dev/null length=32 chars=ascii_letters,digits')}) }}"
  when: inventory_hostname == gatus_secrets_host and gatus_secrets.NtfyTopic is undefined
  no_log: true

- name: enrich push tokens
  set_fact:
    gatus_secrets: "{{ gatus_secrets | combine({'PushTokens': {item: lookup('password', '/dev/null length=48 chars=ascii_letters,digits')}}, recursive=true) }}"
  with_items: "{{ gatus_external_endpoint_keys }}"
  when: inventory_hostname == gatus_secrets_host and (gatus_secrets.PushTokens | default({}))[item] is undefined
  no_log: true

- name: dump secrets file
  become: true
  copy:
    content: "{{ gatus_secrets | to_nice_json }}"
    dest: "{{ gatus_secrets_file_location }}"
    mode: "0600"
  when: inventory_hostname == gatus_secrets_host
  no_log: true

- name: check that the secrets host shared its secrets
  assert:
    that:
      - hostvars[gatus_secrets_host].gatus_secrets is defined
    fail_msg: "Run run_gatus.yml without -l: its first play reads the secrets on {{ gatus_secrets_host }}"
  when: inventory_hostname != gatus_secrets_host

- set_fact:
    gatus_secrets: "{{ hostvars[gatus_secrets_host].gatus_secrets }}"
  when: inventory_hostname != gatus_secrets_host
  no_log: true
